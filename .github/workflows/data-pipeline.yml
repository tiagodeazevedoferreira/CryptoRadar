name: Data Pipeline

# Loop 1: roda sozinho, sem envolver a IA de codigo.
# Busca dados na CoinGecko, calcula a watchlist e publica.

on:
  schedule:
    - cron: "0 * * * *" # a cada hora, no minuto 0 (horario UTC)
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Fetch candidatos (CoinGecko)
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: npm run fetch

      - name: Calcular watchlist
        run: npm run analyze

      - name: Sincronizar com Firebase Realtime DB
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: npm run sync-firebase

      - name: Commit data/latest.json de volta no repo
        run: |
          git config user.name "cryptoradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/latest.json public/data/raw-candidates.json
          git diff --quiet --cached || git commit -m "chore(data): atualiza watchlist [skip ci]"
          git push
